<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 1000"
     width="1200" height="1000"
     role="img" aria-labelledby="title desc">
  <title id="title">Agendatepy logo</title>
  <desc id="desc">Orange rounded A with a white automation toggle and dark agendatepy wordmark.</desc>

  <!-- Isotipo -->
  <g transform="translate(270 85)">
    <!-- Rounded A -->
    <path
      d="M165 585
         C136 585 111 569 99 545
         C88 524 89 501 98 479
         L250 120
         C264 87 295 66 331 66
         L399 66
         C435 66 466 87 480 120
         L632 479
         C641 501 642 524 631 545
         C619 569 594 585 565 585
         C532 585 505 565 493 536
         L449 427
         L281 427
         L237 536
         C225 565 198 585 165 585 Z"
      fill="#FF4F2B"/>

    <!-- Inner triangular cutout -->
    <path
      d="M365 191 L327 273 L403 273 Z"
      fill="#FFFFFF"/>

    <!-- Toggle outline -->
    <rect x="203" y="270"
          width="316" height="112"
          rx="56"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="17"/>

    <!-- Toggle knob -->
    <circle cx="443" cy="326" r="45" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="820"
        text-anchor="middle"
        font-family="Inter, Poppins, Montserrat, Arial, Helvetica, sans-serif"
        font-size="108"
        font-weight="750"
        letter-spacing="-4"
        fill="currentColor">agendatepy</text>
</svg>
