services:
  postgres:
    image: postgres:16-alpine
    container_name: agendatepy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agendatepy
      POSTGRES_USER: agendate
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agendatepy2026secure}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendate -d agendatepy"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Herramientas de base de datos (migraciones y seed). No queda corriendo: deploy.sh lo usa con
  # `docker compose run --rm migrate ...` ANTES de levantar la app nueva.
  migrate:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agendate:${DB_PASSWORD:-agendatepy2026secure}@postgres:5432/agendatepy?schema=public
      DIRECT_URL: postgresql://agendate:${DB_PASSWORD:-agendatepy2026secure}@postgres:5432/agendatepy?schema=public
      NODE_ENV: production
      SEED_DEMO: "${SEED_DEMO:-0}"
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: agendatepy_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agendate:${DB_PASSWORD:-agendatepy2026secure}@postgres:5432/agendatepy?schema=public
      DIRECT_URL: postgresql://agendate:${DB_PASSWORD:-agendatepy2026secure}@postgres:5432/agendatepy?schema=public
      AGENDATE_ROOT_DOMAIN: agendatepy.com
      NEXT_PUBLIC_ROOT_DOMAIN: agendatepy.com
      NEXT_PUBLIC_APP_URL: https://agendatepy.com
      NEXTAUTH_URL: "${NEXTAUTH_URL:-https://agendatepy.com}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      EMAIL_FROM: "${EMAIL_FROM:-AgendatePY <seguridad@agendatepy.com>}"
      EVOLUTION_API_URL: "${EVOLUTION_API_CONTAINER_URL:-http://whatsapp-gateway:8080}"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY:?Definí EVOLUTION_API_KEY en el .env del servidor}"
      EVOLUTION_INSTANCE: "${EVOLUTION_INSTANCE:-agendatepy}"
      SESSION_SECRET: "${SESSION_SECRET:?Definí SESSION_SECRET en el .env del servidor}"
      NODE_ENV: production
    volumes:
      # Imágenes subidas por los negocios (logos, productos): sobreviven a cada deploy
      - app_uploads:/app/public/uploads
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
      - agendatepy_evo_net

  reminder-cron:
    image: node:20-alpine
    container_name: agendatepy_reminder_cron
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: "${CRON_SECRET:?Definí CRON_SECRET en el .env del servidor}"
      INTERVAL_MS: 300000
    volumes:
      - ./frontend/scripts/reminder-cron.mjs:/app/reminder-cron.mjs:ro
    working_dir: /app
    command: ["node", "reminder-cron.mjs"]
    networks:
      - default

  nginx:
    image: nginx:alpine
    container_name: agendatepy_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
  app_uploads:

networks:
  agendatepy_evo_net:
    external: true
